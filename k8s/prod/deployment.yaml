apiVersion: apps/v1
kind: Deployment
metadata:
  name: simple-app
  namespace: prod
  labels:
    app: simple-app
    environment: prod
spec:
  replicas: 3
  selector:
    matchLabels:
      app: simple-app
      environment: prod
  template:
    metadata:
      labels:
        app: simple-app
        environment: prod
    spec:
      containers:
      - name: simple-app
        image: pixelopscloud/simple-app:prod-latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        env:
        - name: ENVIRONMENT
          value: "production"
        - name: PORT
          value: "3000"
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
