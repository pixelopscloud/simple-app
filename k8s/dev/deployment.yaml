apiVersion: apps/v1
kind: Deployment
metadata:
  name: simple-app
  namespace: dev
  labels:
    app: simple-app
    environment: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: simple-app
      environment: dev
  template:
    metadata:
      labels:
        app: simple-app
        environment: dev
    spec:
      containers:
      - name: simple-app
        image: pixelopscloud/simple-app:dev-latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        env:
        - name: ENVIRONMENT
          value: "development"
        - name: PORT
          value: "3000"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
