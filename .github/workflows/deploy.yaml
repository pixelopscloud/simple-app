name: Deploy to Kubernetes

on:
  push:
    branches:
      - dev
      - main

jobs:
  deploy:
    runs-on: self-hosted
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Determine Environment
        id: env
        run: |
          if [ "${{ github.ref }}" == "refs/heads/dev" ]; then
            echo "ENVIRONMENT=dev" >> $GITHUB_OUTPUT
            echo "TAG=dev-latest" >> $GITHUB_OUTPUT
            echo "NAMESPACE=dev" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "ENVIRONMENT=prod" >> $GITHUB_OUTPUT
            echo "TAG=prod-latest" >> $GITHUB_OUTPUT
            echo "NAMESPACE=prod" >> $GITHUB_OUTPUT
          fi
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/simple-app:${{ steps.env.outputs.TAG }} .
      
      - name: Push to Docker Hub
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/simple-app:${{ steps.env.outputs.TAG }}
      
      - name: Deploy to Kubernetes
        run: |
          microk8s kubectl apply -f k8s/${{ steps.env.outputs.ENVIRONMENT }}/
          microk8s kubectl rollout status deployment/simple-app -n ${{ steps.env.outputs.NAMESPACE }}
      
      - name: Verify Deployment
        run: |
          microk8s kubectl get all -n ${{ steps.env.outputs.NAMESPACE }}
